<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2500" viewBox="0 0 1080 2500"><foreignObject width="1080" height="2500"><div xmlns="http://www.w3.org/1999/xhtml" class="p"><style>*{box-sizing:border-box}.p{width:1080px;min-height:2500px;padding:64px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#16343f;background:linear-gradient(#eaf9fc,#f4fbfd 320px)}.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#d6f3f7;color:#0e7490;font-size:24px;font-weight:700}h1{font-size:52px;color:#0b5d70;margin:24px 0 8px}.lead{font-size:26px;color:#52727c;margin:0 0 30px}section{margin:0 0 26px;padding:28px 30px;border:1px solid #cfe5eb;border-radius:24px;background:white}h2{margin:0 0 14px;font-size:34px;color:#0e7490}h3{font-size:27px;color:#176f83;margin:0 0 10px}.i{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:15px 0;border-top:1px solid #e5f0f3}.i:first-of-type{border-top:0}.i>b{font-size:24px;color:#b45309}.i p,.sub p{margin:0}.i strong,.sub strong{display:block;font-size:26px;color:#153f4a}.i span,.sub span{display:block;margin-top:4px;font-size:21px;line-height:1.45;color:#5d7279}ul{margin:0;padding-left:30px}li{font-size:22px;line-height:1.5;margin:8px 0}.sub{padding:18px;margin-top:14px;border-radius:16px;background:#f4fafb}.sub strong{font-size:22px}.sub span{font-size:20px}.foot{text-align:center;font-size:20px;color:#799097;margin-top:20px}</style><div class="tag">珠海长隆飞船酒店 · 2026.08.01—08.02</div><h1>节目表演时间与地点</h1><p class="lead">按本次行程筛选的重点场次；当天以APP和现场电子屏为准</p><section><h2>本次实际必看节目</h2><div class="i"><b>8月1日 13:20</b><p><strong>美人鱼梦幻秀｜海牛馆</strong><span>建议13:10到。</span></p></div><div class="i"><b>8月1日 15:15</b><p><strong>虎鲸之约｜鲸奇世界</strong><span>建议14:50—15:00到。</span></p></div><div class="i"><b>8月1日 16:45</b><p><strong>水之光秀｜星际剧场</strong><span>建议16:35到。</span></p></div><div class="i"><b>8月1日 17:40</b><p><strong>飞船狂欢派对｜深海游乐场</strong><span>建议17:30到，看完离园。</span></p></div><div class="i"><b>8月2日 13:30</b><p><strong>国际小丑乐翻天｜深海游乐场</strong><span>建议13:20到。</span></p></div><div class="i"><b>8月2日 14:30</b><p><strong>闪耀大巡游｜深海游乐场至虎鲸广场</strong><span>建议14:00—14:15到巡游路线。</span></p></div><div class="i"><b>8月2日 16:00</b><p><strong>虎鲸海洋霸主秀｜虎鲸科普剧场</strong><span>建议15:35—15:45到。</span></p></div></section><section><h2>暑期节目场次参考</h2><div class="sub"><h3>一楼</h3><p><strong>水之光秀</strong><span>10:40、13:40、16:45｜星际剧场</span></p><p><strong>美人鱼梦幻秀</strong><span>11:20、13:20、14:20、15:20、16:30｜海牛馆</span></p><p><strong>虎鲸之约</strong><span>11:00、15:15｜鲸奇世界</span></p><p><strong>雨林剧场</strong><span>11:30、14:30、15:40｜热带雨林馆</span></p><p><strong>渔村欢乐汇</strong><span>10:15、11:15、12:30、15:40｜长江江豚馆</span></p><p><strong>珊瑚互动秀</strong><span>10:45、11:20、13:40、14:20、15:00、15:50｜珊瑚馆</span></p></div><div class="sub"><h3>二楼</h3><p><strong>虎鲸海洋霸主秀</strong><span>12:00、16:00｜虎鲸科普剧场</span></p><p><strong>国际小丑乐翻天</strong><span>13:30｜深海游乐场</span></p><p><strong>闪耀大巡游</strong><span>14:30｜深海游乐场至虎鲸广场</span></p><p><strong>飞船狂欢派对</strong><span>17:40｜深海游乐场</span></p></div></section><section><h2>看表演的执行规则</h2><ul><li>入园后立即查看长隆APP和现场电子屏，旧节目表只作参考。</li><li>虎鲸和剧场类节目提前15—25分钟到场；其他互动秀提前10分钟。</li><li>第一天不追14:30巡游和16:00虎鲸大秀，避免与15:15虎鲸之约冲突。</li><li>第二天跟拍结束后先吃饭，再看13:30小丑秀、14:30巡游、16:00虎鲸大秀。</li><li>节目临时取消时不要跨区硬赶，优先顺路展馆和孩子体力。</li></ul></section><div class="foot">现场以长隆APP、酒店通知和项目入口规则为准</div></div></foreignObject></svg>