<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2800" viewBox="0 0 1080 2800"><foreignObject width="1080" height="2800"><div xmlns="http://www.w3.org/1999/xhtml" class="p"><style>*{box-sizing:border-box}.p{width:1080px;min-height:2800px;padding:64px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#16343f;background:linear-gradient(#eaf9fc,#f4fbfd 320px)}.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#d6f3f7;color:#0e7490;font-size:24px;font-weight:700}h1{font-size:52px;color:#0b5d70;margin:24px 0 8px}.lead{font-size:26px;color:#52727c;margin:0 0 30px}section{margin:0 0 26px;padding:28px 30px;border:1px solid #cfe5eb;border-radius:24px;background:white}h2{margin:0 0 14px;font-size:34px;color:#0e7490}h3{font-size:27px;color:#176f83;margin:0 0 10px}.i{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:15px 0;border-top:1px solid #e5f0f3}.i:first-of-type{border-top:0}.i>b{font-size:24px;color:#b45309}.i p,.sub p{margin:0}.i strong,.sub strong{display:block;font-size:26px;color:#153f4a}.i span,.sub span{display:block;margin-top:4px;font-size:21px;line-height:1.45;color:#5d7279}ul{margin:0;padding-left:30px}li{font-size:22px;line-height:1.5;margin:8px 0}.sub{padding:18px;margin-top:14px;border-radius:16px;background:#f4fafb}.sub strong{font-size:22px}.sub span{font-size:20px}.foot{text-align:center;font-size:20px;color:#799097;margin-top:20px}</style><div class="tag">珠海长隆飞船酒店 · 2026.08.01—08.02</div><h1>两天整体行程执行图</h1><p class="lead">两大两小｜景田自驾｜8月2日11点跟拍｜第一晚游泳</p><section><h2>8月1日｜深圳出发、入园、晚餐、游泳</h2><div class="i"><b>07:30—08:15</b><p><strong>景田家中早餐</strong><span>孩子吃饱、上厕所；乐园包、泳池袋、行李箱分开放。</span></p></div><div class="i"><b>08:30—08:45</b><p><strong>从景田正式出发</strong><span>推荐08:30，最晚不超过09:00；导航飞船酒店停车场。</span></p></div><div class="i"><b>10:50—11:30</b><p><strong>抵达飞船酒店</strong><span>登记入住、授权车牌、绑定门票、寄存行李。</span></p></div><div class="i"><b>11:40—12:25</b><p><strong>午餐</strong><span>11:20前办完手续吃酒店食集；更晚则直接入园吃面馆或飞船餐厅。</span></p></div><div class="i"><b>12:30—17:55</b><p><strong>飞船乐园第一天</strong><span>一楼展馆＋13:20美人鱼＋15:15虎鲸之约＋16:45水之光秀＋17:40派对。</span></p></div><div class="i"><b>18:00—18:15</b><p><strong>回酒店房间</strong><span>领取房卡、放东西、孩子上厕所。</span></p></div><div class="i"><b>18:30—19:30</b><p><strong>横琴中央汇晚餐</strong><span>优先椰子鸡或中式小炒；四人预算260—340元。</span></p></div><div class="i"><b>20:00—20:45</b><p><strong>酒店无边际泳池</strong><span>4套泳衣、4顶泳帽；雷雨关闭则提前休息。</span></p></div><div class="i"><b>22:00</b><p><strong>第一天结束</strong><span>洗澡、处理湿衣物、准备跟拍衣服，孩子睡觉。</span></p></div></section><section><h2>8月2日｜提前入园、跟拍、巡游、返深</h2><div class="i"><b>07:30—08:15</b><p><strong>酒店早餐</strong><span>套餐已含两大两小；主食、鸡蛋、牛奶优先。</span></p></div><div class="i"><b>08:15—08:55</b><p><strong>收行李并退房寄存</strong><span>湿泳衣密封；不要等跟拍结束再退房。</span></p></div><div class="i"><b>09:00—10:15</b><p><strong>住客提前入园</strong><span>直上二楼玩热门项目，两位家长按身高分组。</span></p></div><div class="i"><b>10:15—10:50</b><p><strong>跟拍前整理</strong><span>上厕所、擦汗、整理头发衣服，联系摄影师。</span></p></div><div class="i"><b>11:00—12:00</b><p><strong>一小时家庭跟拍</strong><span>入口主题区＋大鱼缸/鲸奇世界＋珊瑚馆；不换完整服装。</span></p></div><div class="i"><b>12:05—12:50</b><p><strong>园内午餐</strong><span>引力面馆或飞船餐厅，四人预算220—320元。</span></p></div><div class="i"><b>13:30</b><p><strong>国际小丑乐翻天</strong><span>深海游乐场。</span></p></div><div class="i"><b>14:30</b><p><strong>飞船乐园闪耀大巡游</strong><span>提前15—30分钟到巡游路线。</span></p></div><div class="i"><b>16:00</b><p><strong>虎鲸海洋霸主秀</strong><span>15:35—15:45抵达虎鲸科普剧场。</span></p></div><div class="i"><b>17:10—17:30</b><p><strong>离园并取行李</strong><span>清点证件、充电宝、水杯和湿衣袋。</span></p></div><div class="i"><b>17:30以后</b><p><strong>晚餐或直接返深</strong><span>孩子状态好去中央汇/深井村；很累则直接返深。</span></p></div><div class="i"><b>21:00—21:45</b><p><strong>抵达景田家中</strong><span>整个行程终点；先处理湿衣物，再让孩子洗漱。</span></p></div></section><div class="foot">现场以长隆APP、酒店通知和项目入口规则为准</div></div></foreignObject></svg>