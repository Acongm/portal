<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2900" viewBox="0 0 1080 2900"><foreignObject width="1080" height="2900"><div xmlns="http://www.w3.org/1999/xhtml" class="p"><style>*{box-sizing:border-box}.p{width:1080px;min-height:2900px;padding:64px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#16343f;background:linear-gradient(#eaf9fc,#f4fbfd 320px)}.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#d6f3f7;color:#0e7490;font-size:24px;font-weight:700}h1{font-size:52px;color:#0b5d70;margin:24px 0 8px}.lead{font-size:26px;color:#52727c;margin:0 0 30px}section{margin:0 0 26px;padding:28px 30px;border:1px solid #cfe5eb;border-radius:24px;background:white}h2{margin:0 0 14px;font-size:34px;color:#0e7490}h3{font-size:27px;color:#176f83;margin:0 0 10px}.i{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:15px 0;border-top:1px solid #e5f0f3}.i:first-of-type{border-top:0}.i>b{font-size:24px;color:#b45309}.i p,.sub p{margin:0}.i strong,.sub strong{display:block;font-size:26px;color:#153f4a}.i span,.sub span{display:block;margin-top:4px;font-size:21px;line-height:1.45;color:#5d7279}ul{margin:0;padding-left:30px}li{font-size:22px;line-height:1.5;margin:8px 0}.sub{padding:18px;margin-top:14px;border-radius:16px;background:#f4fafb}.sub strong{font-size:22px}.sub span{font-size:20px}.foot{text-align:center;font-size:20px;color:#799097;margin-top:20px}</style><div class="tag">珠海长隆飞船酒店 · 2026.08.01—08.02</div><h1>飞船乐园两日游玩路线</h1><p class="lead">第一天一楼慢看，第二天二楼错峰；减少上下楼和来回赶场</p><section><h2>第一天路线｜一楼动物展馆＋核心表演</h2><div class="i"><b>12:30</b><p><strong>宇宙世界</strong><span>入口主题区，简单拍照，不停留过久。</span></p></div><div class="i"><b>12:50</b><p><strong>长江江豚馆</strong><span>看江豚和场馆展示。</span></p></div><div class="i"><b>13:20</b><p><strong>海牛馆</strong><span>美人鱼梦幻秀，建议13:10到。</span></p></div><div class="i"><b>13:35—14:15</b><p><strong>珊瑚馆＋鲨鱼馆</strong><span>看鱼群、珊瑚、鲨鱼，顺路拍照。</span></p></div><div class="i"><b>14:15—14:40</b><p><strong>热带雨林馆</strong><span>轻松看展，给孩子体力缓冲。</span></p></div><div class="i"><b>14:40—15:00</b><p><strong>前往鲸奇世界</strong><span>上厕所、补水、提前入场。</span></p></div><div class="i"><b>15:15</b><p><strong>鲸奇世界</strong><span>虎鲸之约，第一天最重要节目。</span></p></div><div class="i"><b>15:45—16:25</b><p><strong>鲸奇世界附近</strong><span>继续看虎鲸展窗，避开散场人流。</span></p></div><div class="i"><b>16:45</b><p><strong>星际剧场</strong><span>水之光秀，建议16:35到。</span></p></div><div class="i"><b>17:05—17:30</b><p><strong>二楼深海游乐场</strong><span>只玩一个全家项目，不排长队。</span></p></div><div class="i"><b>17:40</b><p><strong>深海游乐场</strong><span>飞船狂欢派对，看完回酒店。</span></p></div></section><section><h2>第二天路线｜热门项目＋跟拍＋巡游＋虎鲸大秀</h2><div class="i"><b>09:00—10:05</b><p><strong>二楼热门项目</strong><span>哥哥约121cm、弟弟约102cm；按入口量身分组行动。</span></p></div><div class="i"><b>10:05—10:15</b><p><strong>全家汇合</strong><span>玩一个两孩都能参加的项目。</span></p></div><div class="i"><b>10:15—10:50</b><p><strong>跟拍准备</strong><span>上厕所、擦汗、整理服装，不再玩水或激烈项目。</span></p></div><div class="i"><b>11:00—12:00</b><p><strong>家庭跟拍</strong><span>入口主题区＋大鱼缸/鲸奇世界＋珊瑚馆。</span></p></div><div class="i"><b>12:05—12:50</b><p><strong>园内午餐</strong><span>不出园，减少折返。</span></p></div><div class="i"><b>12:50—13:20</b><p><strong>低排队项目</strong><span>根据APP排队时间灵活选择。</span></p></div><div class="i"><b>13:30</b><p><strong>国际小丑乐翻天</strong><span>边看边休息。</span></p></div><div class="i"><b>14:30</b><p><strong>闪耀大巡游</strong><span>13:55以后到巡游路线占位。</span></p></div><div class="i"><b>14:50—15:35</b><p><strong>分组补项目</strong><span>哥哥玩身高允许项目，弟弟玩低龄项目。</span></p></div><div class="i"><b>16:00</b><p><strong>虎鲸海洋霸主秀</strong><span>提前15—25分钟入场。</span></p></div><div class="i"><b>16:30—17:00</b><p><strong>每孩重玩一个项目</strong><span>不再追求全部打卡。</span></p></div><div class="i"><b>17:10</b><p><strong>离园</strong><span>回酒店取寄存行李。</span></p></div></section><section><h2>现场分组原则</h2><ul><li>项目入口现场量身和安全规则优先，不以网上身高说明争论。</li><li>弟弟身高不足时，一位家长带哥哥排项目，另一位带弟弟看展或玩低龄项目。</li><li>普通项目排队超过30分钟，只保留孩子特别想玩的。</li><li>两个孩子明显疲劳时，直接取消机动项目，转看展馆或表演。</li></ul></section><div class="foot">现场以长隆APP、酒店通知和项目入口规则为准</div></div></foreignObject></svg>