<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2700" viewBox="0 0 1080 2700"><foreignObject width="1080" height="2700"><div xmlns="http://www.w3.org/1999/xhtml" class="p"><style>*{box-sizing:border-box}.p{width:1080px;min-height:2700px;padding:64px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#16343f;background:linear-gradient(#eaf9fc,#f4fbfd 320px)}.tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#d6f3f7;color:#0e7490;font-size:24px;font-weight:700}h1{font-size:52px;color:#0b5d70;margin:24px 0 8px}.lead{font-size:26px;color:#52727c;margin:0 0 30px}section{margin:0 0 26px;padding:28px 30px;border:1px solid #cfe5eb;border-radius:24px;background:white}h2{margin:0 0 14px;font-size:34px;color:#0e7490}h3{font-size:27px;color:#176f83;margin:0 0 10px}.i{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:15px 0;border-top:1px solid #e5f0f3}.i:first-of-type{border-top:0}.i>b{font-size:24px;color:#b45309}.i p,.sub p{margin:0}.i strong,.sub strong{display:block;font-size:26px;color:#153f4a}.i span,.sub span{display:block;margin-top:4px;font-size:21px;line-height:1.45;color:#5d7279}ul{margin:0;padding-left:30px}li{font-size:22px;line-height:1.5;margin:8px 0}.sub{padding:18px;margin-top:14px;border-radius:16px;background:#f4fafb}.sub strong{font-size:22px}.sub span{font-size:20px}.foot{text-align:center;font-size:20px;color:#799097;margin-top:20px}</style><div class="tag">珠海长隆飞船酒店 · 2026.08.01—08.02</div><h1>吃饭选择与携带清单</h1><p class="lead">人均约60—80元，上限100元；不必每顿外出</p><section><h2>两天吃饭安排</h2><div class="i"><b>8月1日 早餐</b><p><strong>景田家中</strong><span>出门前吃饱，避免途中找早餐。</span></p></div><div class="i"><b>8月1日 午餐</b><p><strong>酒店食集或园内面馆/飞船餐厅</strong><span>四人预算220—300元；按办完入住时间选择。</span></p></div><div class="i"><b>8月1日 晚餐</b><p><strong>横琴中央汇</strong><span>优先椰子鸡或中式小炒；四人预算260—340元。</span></p></div><div class="i"><b>8月2日 早餐</b><p><strong>酒店套餐</strong><span>已含两大两小。</span></p></div><div class="i"><b>8月2日 午餐</b><p><strong>引力面馆或飞船餐厅</strong><span>跟拍结束后直接吃；四人预算220—320元。</span></p></div><div class="i"><b>8月2日 晚餐</b><p><strong>中央汇、深井村或返深途中</strong><span>孩子状态决定；四人预算220—360元。</span></p></div></section><section><h2>中央汇 vs 深井村</h2><div class="sub"><h3>中央汇｜第一晚首选</h3><p><strong>类型</strong><span>商业街餐饮区，空调、洗手间和停车更稳定</span></p><p><strong>选择</strong><span>椰子鸡、粤菜、湘菜、火锅、茶餐厅、粉面</span></p><p><strong>优点</strong><span>菜单和套餐较透明，排队时可步行换店</span></p><p><strong>预算</strong><span>四人260—340元</span></p></div><div class="sub"><h3>深井村｜第二晚备选</h3><p><strong>类型</strong><span>村落餐馆和大排档，烟火气更强</span></p><p><strong>选择</strong><span>烧鸡、烧鹅、炒牛河、砂锅粥、海鲜、小炒</span></p><p><strong>风险</strong><span>活海鲜、加工费和茶位费容易抬高总价</span></p><p><strong>预算</strong><span>四人240—360元</span></p></div></section><section><h2>乐园随身包</h2><ul><li>四人有效证件、酒店/门票/摄影订单截图。</li><li>4个自备水杯、防滑袜、手机、充电宝、充电线。</li><li>3件一次性雨衣＋1件儿童非一次性雨衣。</li><li>两个孩子各1件薄外套、1套替换衣服、内裤和袜子。</li><li>湿纸巾、纸巾、垃圾袋、晕车袋、创可贴和常用药。</li><li>密封袋、干湿分离袋；牛肉干等普通零食留在车内或酒店。</li></ul></section><section><h2>泳池独立袋</h2><ul><li>4套泳衣、4顶真正泳帽。</li><li>儿童泳镜、防滑拖鞋、防水手机袋。</li><li>至少2个干湿分离袋。</li><li>每人一套换洗内衣和睡衣；儿童浴巾可选。</li><li>雷雨或恶劣天气可能关闭泳池，入住时确认当晚开放时间。</li></ul></section><section><h2>出门前最后确认</h2><ul><li>导航终点：横琴长隆飞船酒店停车场。</li><li>08:30—08:45正式出发，最晚不超过09:00。</li><li>摄影师门票、集合地点和拍摄规则已确认。</li><li>节目时间进入乐园后重新核对。</li></ul></section><div class="foot">现场以长隆APP、酒店通知和项目入口规则为准</div></div></foreignObject></svg>